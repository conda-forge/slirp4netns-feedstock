schema_version: 1

context:
  version: "1.3.5"

package:
  name: slirp4netns
  version: ${{ version }}

source:
  url: https://github.com/rootless-containers/slirp4netns/archive/v${{ version }}.tar.gz
  sha256: a27ed4c7311616516b56015cc74fa06c6431f5c8ebadaf331c0e08150d1a84ce

build:
  number: 0
  skip: not linux

requirements:
  build:
    - ${{ compiler('c') }}
    - autoconf >=2.69
    - automake >=1.11.2
    - make
    - pkg-config >=0.9.0
  host:
    - glib
    # Header+pkgconfig files for libglib are in the glib package.
    - libglib
    - libslirp >=4.1.0
    - libslirp
    - libcap
    - libseccomp
  ignore_run_exports:
    # slirp4netns uses defines from libcap but does not link to it.
    from_package:
      - libcap

tests:
  - script:
      - slirp4netns --help
      - slirp4netns --version

about:
  homepage: https://github.com/rootless-containers/slirp4netns
  repository: https://github.com/rootless-containers/slirp4netns
  documentation: https://github.com/rootless-containers/slirp4netns
  license: GPL-2.0-or-later AND MIT
  license_file:
    - COPYING
    - vendor/parson/LICENSE
  summary: User-mode networking for unprivileged network namespaces.
  description: >
    slirp4netns provides user-mode networking ("slirp") for unprivileged network namespaces.

extra:
  recipe-maintainers:
    - mbargull
    - trim21
