schema_version: 1

context:
  version: "1.3.7"

package:
  name: slirp4netns
  version: ${{ version }}

source:
  url: https://github.com/rootless-containers/slirp4netns/archive/v${{ version }}.tar.gz
  sha256: 79079c69149c9d7ec81f5f5a7e705951dc788bc5e300849e3adfef69f8232836

build:
  number: 0
  skip: not linux

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - autoconf >=2.69
    - automake >=1.11.2
    - make
    - pkg-config >=0.9.0
  host:
    # glibconfig.h and the other glib headers are only in the glib output.
    - glib
    - libglib
    - libslirp >=4.1.0
    - libcap
    - libseccomp
  ignore_run_exports:
    # slirp4netns uses defines from libcap but does not link to it.
    from_package:
      - libcap

tests:
  - script:
      - slirp4netns --help
      - slirp4netns --version

about:
  homepage: https://github.com/rootless-containers/slirp4netns
  repository: https://github.com/rootless-containers/slirp4netns
  documentation: https://github.com/rootless-containers/slirp4netns
  license: GPL-2.0-or-later AND MIT
  license_file:
    - COPYING
    - vendor/parson/LICENSE
  summary: User-mode networking for unprivileged network namespaces.
  description: >
    slirp4netns provides user-mode networking ("slirp") for unprivileged network namespaces.

extra:
  recipe-maintainers:
    - mbargull
    - trim21
